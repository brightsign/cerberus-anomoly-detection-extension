<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Wall Anomaly Monitor</title>
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .connection-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .status-connected {
            background: #10b981;
            color: white;
        }
        
        .status-disconnected {
            background: #ef4444;
            color: white;
        }
        
        .config-panel {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .config-panel input {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        .config-panel button {
            padding: 8px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }
        
        .config-panel button:hover {
            background: #5568d3;
        }
        
        .monitors {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .monitor-card {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .monitor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .monitor-title {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        
        .monitor-status {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        
        .status-ok {
            background: #10b981;
            color: white;
        }
        
        .status-freeze {
            background: #3b82f6;
            color: white;
            animation: pulse 2s infinite;
        }
        
        .status-black {
            background: #1f2937;
            color: white;
            animation: pulse 2s infinite;
        }
        
        .status-mismatch {
            background: #f59e0b;
            color: white;
            animation: pulse 2s infinite;
        }
        
        .status-lag {
            background: #8b5cf6;
            color: white;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .monitor-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .stat {
            background: #f3f4f6;
            padding: 10px;
            border-radius: 5px;
        }
        
        .stat-label {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 5px;
        }
        
        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #111827;
        }
        
        .event-log {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .event-log h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #333;
        }
        
        .event-list {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .event-item {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 5px;
            border-left: 4px solid;
            background: #f9fafb;
        }
        
        .event-freeze {
            border-color: #3b82f6;
        }
        
        .event-black {
            border-color: #1f2937;
        }
        
        .event-recovered {
            border-color: #10b981;
        }
        
        .event-mismatch {
            border-color: #f59e0b;
        }
        
        .event-lag {
            border-color: #8b5cf6;
        }
        
        .event-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .event-tv {
            font-weight: bold;
            color: #667eea;
        }
        
        .event-type {
            font-weight: bold;
        }
        
        .event-time {
            font-size: 12px;
            color: #6b7280;
        }
        
        .event-details {
            font-size: 12px;
            color: #4b5563;
            margin-top: 5px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        
        .controls button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .btn-clear {
            background: #ef4444;
            color: white;
        }
        
        .btn-export {
            background: #10b981;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎬 Video Wall Anomaly Monitor</h1>
            <span id="connectionStatus" class="connection-status status-disconnected">Disconnected</span>
        </header>
        
        <div class="config-panel">
            <label>MQTT Broker:</label>
            <input type="text" id="mqttHost" placeholder="127.0.0.1" value="127.0.0.1">
            <label>Port:</label>
            <input type="number" id="mqttPort" placeholder="9001" value="9001">
            <label>Topic:</label>
            <input type="text" id="mqttTopic" placeholder="videowall/events" value="videowall/events">
            <button onclick="connectMQTT()">Connect</button>
        </div>
        
        <div class="monitors">
            <div class="monitor-card" id="monitor-tv1">
                <div class="monitor-header">
                    <span class="monitor-title">📺 Monitor 1 (tv1)</span>
                    <span class="monitor-status status-ok">OK</span>
                </div>
                <div class="monitor-stats">
                    <div class="stat">
                        <div class="stat-label">Total Events</div>
                        <div class="stat-value" id="tv1-total">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Anomalies</div>
                        <div class="stat-value" id="tv1-anomalies">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Last Event</div>
                        <div class="stat-value" id="tv1-last">Never</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Uptime</div>
                        <div class="stat-value" id="tv1-uptime">100%</div>
                    </div>
                </div>
            </div>
            
            <div class="monitor-card" id="monitor-tv2">
                <div class="monitor-header">
                    <span class="monitor-title">📺 Monitor 2 (tv2)</span>
                    <span class="monitor-status status-ok">OK</span>
                </div>
                <div class="monitor-stats">
                    <div class="stat">
                        <div class="stat-label">Total Events</div>
                        <div class="stat-value" id="tv2-total">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Anomalies</div>
                        <div class="stat-value" id="tv2-anomalies">0</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Last Event</div>
                        <div class="stat-value" id="tv2-last">Never</div>
                    </div>
                    <div class="stat">
                        <div class="stat-label">Uptime</div>
                        <div class="stat-value" id="tv2-uptime">100%</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="event-log">
            <h2>📋 Event Log</h2>
            <div class="event-list" id="eventList">
                <p style="text-align: center; color: #9ca3af; padding: 20px;">
                    Waiting for events...
                </p>
            </div>
            <div class="controls">
                <button class="btn-clear" onclick="clearEvents()">Clear Log</button>
                <button class="btn-export" onclick="exportEvents()">Export CSV</button>
            </div>
        </div>
    </div>
    
    <script>
        let mqttClient = null;
        let events = [];
        let monitorStats = {
            tv1: { total: 0, anomalies: 0, anomalyStart: null },
            tv2: { total: 0, anomalies: 0, anomalyStart: null }
        };
        
        function connectMQTT() {
            const host = document.getElementById('mqttHost').value;
            const port = parseInt(document.getElementById('mqttPort').value);
            const topic = document.getElementById('mqttTopic').value;
            
            // MQTT over WebSocket (broker must support WebSockets on port 9001)
            const url = `ws://${host}:${port}`;
            
            console.log('Connecting to:', url);
            mqttClient = mqtt.connect(url, {
                clientId: 'dashboard_' + Math.random().toString(16).substr(2, 8)
            });
            
            mqttClient.on('connect', () => {
                console.log('Connected to MQTT broker');
                document.getElementById('connectionStatus').textContent = 'Connected';
                document.getElementById('connectionStatus').className = 'connection-status status-connected';
                
                mqttClient.subscribe(topic, (err) => {
                    if (err) {
                        console.error('Subscribe error:', err);
                    } else {
                        console.log('Subscribed to:', topic);
                    }
                });
            });
            
            mqttClient.on('message', (topic, message) => {
                try {
                    const event = JSON.parse(message.toString());
                    handleEvent(event);
                } catch (e) {
                    console.error('Failed to parse message:', e);
                }
            });
            
            mqttClient.on('error', (err) => {
                console.error('MQTT error:', err);
                document.getElementById('connectionStatus').textContent = 'Error';
                document.getElementById('connectionStatus').className = 'connection-status status-disconnected';
            });
            
            mqttClient.on('close', () => {
                console.log('Disconnected from MQTT broker');
                document.getElementById('connectionStatus').textContent = 'Disconnected';
                document.getElementById('connectionStatus').className = 'connection-status status-disconnected';
            });
        }
        
        function handleEvent(event) {
            console.log('Event received:', event);
            
            // Add to events array
            events.unshift(event);
            if (events.length > 100) events.pop(); // Keep last 100 events
            
            // Update stats
            const tvId = event.tv_id || 'unknown';
            if (monitorStats[tvId]) {
                monitorStats[tvId].total++;
                
                // Track anomaly state
                const isAnomaly = ['FREEZE', 'BLACK', 'MISMATCH', 'LAG', 'STUTTER', 'CAMERA_OFFLINE'].includes(event.type);
                const isRecovery = ['RECOVERED', 'BLACK_RECOVERED'].includes(event.type);
                
                if (isAnomaly) {
                    monitorStats[tvId].anomalies++;
                    if (!monitorStats[tvId].anomalyStart) {
                        monitorStats[tvId].anomalyStart = Date.now();
                    }
                } else if (isRecovery) {
                    monitorStats[tvId].anomalyStart = null;
                }
                
                updateMonitorUI(tvId, event.type);
                updateStatsUI(tvId);
            }
            
            // Update event log
            updateEventLog();
        }
        
        function updateMonitorUI(tvId, eventType) {
            const card = document.querySelector(`#monitor-${tvId}`);
            if (!card) return;
            
            const statusEl = card.querySelector('.monitor-status');
            
            switch (eventType) {
                case 'FREEZE':
                    statusEl.textContent = 'FREEZE';
                    statusEl.className = 'monitor-status status-freeze';
                    break;
                case 'BLACK':
                    statusEl.textContent = 'BLACK';
                    statusEl.className = 'monitor-status status-black';
                    break;
                case 'MISMATCH':
                    statusEl.textContent = 'MISMATCH';
                    statusEl.className = 'monitor-status status-mismatch';
                    break;
                case 'LAG':
                    statusEl.textContent = 'LAG';
                    statusEl.className = 'monitor-status status-lag';
                    break;
                case 'RECOVERED':
                case 'BLACK_RECOVERED':
                    statusEl.textContent = 'OK';
                    statusEl.className = 'monitor-status status-ok';
                    break;
            }
        }
        
        function updateStatsUI(tvId) {
            const stats = monitorStats[tvId];
            
            document.getElementById(`${tvId}-total`).textContent = stats.total;
            document.getElementById(`${tvId}-anomalies`).textContent = stats.anomalies;
            document.getElementById(`${tvId}-last`).textContent = new Date().toLocaleTimeString();
            
            // Calculate uptime
            const totalTime = stats.total * 200; // Assuming 5fps = 200ms per sample
            const anomalyTime = stats.anomalies * 2000; // Assuming avg 2s per anomaly
            const uptime = totalTime > 0 ? ((totalTime - anomalyTime) / totalTime * 100).toFixed(1) : 100;
            document.getElementById(`${tvId}-uptime`).textContent = uptime + '%';
        }
        
        function updateEventLog() {
            const listEl = document.getElementById('eventList');
            
            if (events.length === 0) {
                listEl.innerHTML = '<p style="text-align: center; color: #9ca3af; padding: 20px;">No events yet...</p>';
                return;
            }
            
            listEl.innerHTML = events.map(event => {
                const time = new Date(event.ts_ms || Date.now()).toLocaleTimeString();
                const eventClass = `event-${event.type.toLowerCase().replace('_', '-')}`;
                
                return `
                    <div class="event-item ${eventClass}">
                        <div class="event-header">
                            <span class="event-tv">${event.tv_id || 'unknown'}</span>
                            <span class="event-type">${event.type}</span>
                            <span class="event-time">${time}</span>
                        </div>
                        ${event.details ? `<div class="event-details">${event.details}</div>` : ''}
                    </div>
                `;
            }).join('');
        }
        
        function clearEvents() {
            if (confirm('Clear all events from the log?')) {
                events = [];
                updateEventLog();
            }
        }
        
        function exportEvents() {
            if (events.length === 0) {
                alert('No events to export');
                return;
            }
            
            // Create CSV
            const csv = [
                'Timestamp,TV ID,Event Type,Details',
                ...events.map(e => {
                    const time = new Date(e.ts_ms || Date.now()).toISOString();
                    const details = (e.details || '').replace(/"/g, '""');
                    return `"${time}","${e.tv_id}","${e.type}","${details}"`;
                })
            ].join('\n');
            
            // Download
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `videowall-events-${Date.now()}.csv`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // Auto-connect on page load if config is set
        window.addEventListener('load', () => {
            const host = document.getElementById('mqttHost').value;
            const port = document.getElementById('mqttPort').value;
            if (host && port) {
                // Uncomment to auto-connect:
                // connectMQTT();
            }
        });
    </script>
</body>
</html>
